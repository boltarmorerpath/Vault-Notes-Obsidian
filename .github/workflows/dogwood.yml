name: "gecko"
run-name: "Notice"
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  sedge:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-22.04
    environment:
      name: "github-pages"
      url: ${{ steps.Mire.outputs.page_url }}
    steps:
      - name: "Serval"
        uses: actions/checkout@v5
      - name: "Balsam"
        uses: actions/configure-pages@v6
      - name: "TOPAZ"
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: "VIOLA"
        id: Mire
        uses: actions/deploy-pages@v5
